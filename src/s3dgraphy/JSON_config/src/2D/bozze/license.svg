<!-- license — the palette pictogram (refid 6 = src/2D/license.png) redrawn on a
     GRID, not traced. The mark is built square and turned 45°: a central square
     and two interlocking brackets, each the other turned 180° about the centre.
     In the turned frame (S = x+y, T = y−x, from the centre) every band is 12
     wide and every gap round the square is 5; the PNG measures 12–13 and 4–7,
     which reads as the same drawing with antialiasing, so the grid wins.
     Box 125×128 as in the PNG (aspect 0.977). Colours sampled from the PNG:
     ring #333333, mark #6E6E6E, interior transparent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 128">
  <polygon data-role="ground" fill="#6E6E6E" points="48,14.5 89,55.5 83,61.5 62.5,41 31,72.5 25,66.5 56.5,35 48,26.5 21,53.5 15,47.5"/>
  <polygon data-role="ground" fill="#6E6E6E" points="77,113.5 36,72.5 42,66.5 62.5,87 94,55.5 100,61.5 68.5,93 77,101.5 104,74.5 110,80.5"/>
  <polygon data-role="ground" fill="#6E6E6E" points="62.5,46 80.5,64 62.5,82 44.5,64"/>
  <circle data-role="ink" cx="62.5" cy="64" r="59.5" fill="none" stroke="#333333" stroke-width="7"/>
</svg>
