root = "code/"
license = "SPDX:EUPL-1.2"
entry = "facemesh_fit:plugin"
hosts = ["emstudio"]
platforms = ["macos-arm64", "windows-x64", "linux-x64"]
  [code.permissions]
  files = "Legge le texture del modello per riconoscere il volto"
  [code.descriptor]
  host = "emstudio-side"
  transport = ["direct"]
  capabilities = ["read-graph", "ingest-batch"]
  provenance = "derivation"
  [[code.commands]]
  id = "facemesh.propose"
  label = { it = "Proponi i punti del volto", en = "Propose face points" }
  writes = true
  slots = [{ name = "model", kind = "id" }]
  in = ["context.node@1", "menu.tools@1"]
  when = "selection:RM"
