# Read the Docs — the EMStudio Python API, a project of its own.
# Create the project on readthedocs.org pointing at the s3Dgraphy repository and
# set, in its Admin ▸ Settings, «Path for .readthedocs.yaml» = docs-api/.readthedocs.yaml.
# Italian: a second project (language it) with the same file, added as a
# translation of the first, as for the EMStudio manual.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs-api/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs-api/requirements.txt
