[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3dgraphy"
version = "1.6.0.dev29"
description = "3D Stratigraphic Graph Management Library for archaeological and heritage applications"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Emanuel Demetrescu", email = "emanuel.demetrescu@cnr.it"}
]
maintainers = [
    {name = "Emanuel Demetrescu", email = "emanuel.demetrescu@cnr.it"}
]
keywords = [
    "archaeology", 
    "stratigraphy", 
    "graph", 
    "3d", 
    "heritage",
    "temporal-modeling",
    "knowledge-graph",
    "extended-matrix"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research", 
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Database :: Database Engines/Servers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: English",
]

dependencies = [
    # Strict runtime dependencies — directly imported by s3dgraphy core.
    # Kept minimal: numpy was removed in 1.6.0 (only transitive via pandas;
    # no direct s3dgraphy code imports numpy).
    "pandas>=2.0.0",            # used by xlsx_importer, mapping system
    "lxml>=4.9.0",              # used by graphml importer/exporter
    "openpyxl>=3.0.0",          # used by xlsx_importer
    "networkx>=3.0",            # used by temporal/inference_engine.py
    # The stamp FORMAT — read, write, compare, walk — extracted so that a
    # Blender add-on or a Metashape script can use it without installing any of
    # the four above. It has zero dependencies of its own and is one module, so
    # it can also simply be copied; s3dgraphy depends on it rather than
    # vendoring it, because two copies of a format rule drift.
    "dtcstamp>=0.1.3",  # 0.1.1 lacks stamp_description: import s3dgraphy.stamp fails (MICRO-DTCSTAMP-012)
]

[project.urls]
Homepage = "https://github.com/ExtendedMatrix/s3Dgraphy"
Documentation = "https://docs.extendedmatrix.org/projects/s3dgraphy/"
Repository = "https://github.com/ExtendedMatrix/s3Dgraphy.git"
"Bug Reports" = "https://github.com/ExtendedMatrix/s3Dgraphy/issues"
"Source Code" = "https://github.com/ExtendedMatrix/s3Dgraphy"
"Extended Matrix" = "https://www.extendedmatrix.org"
Changelog = "https://github.com/ExtendedMatrix/s3Dgraphy/blob/main/CHANGELOG.md"

# ─────────────────────────────────────────────────────────────────────────
# Optional features — pip install s3dgraphy[<extra>]
#
# Pattern: each feature that requires extra runtime libraries is opt-in.
# This keeps the core install small and avoids forcing rdflib/pyoxigraph
# on consumers that only need GraphML/JSON/xlsx pipelines.
#
# Recommended for most users:
#     pip install s3dgraphy[full]
# ─────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]
rdf = [
    # RDF export pipeline (RDFExporter → Turtle / N-Triples / JSON-LD / TriG / RDF-XML)
    # via s3dgraphy.exporter.rdf_exporter. Without this extra, importing
    # RDFExporter raises ImportError (gracefully handled by exporter/__init__.py).
    "rdflib>=7.0",
]
rdf-embedded = [
    # RDF export + embedded SPARQL store (no separate server required).
    # Kept available for later (embedded read/write workflow); Phase 1 uses the
    # TTL projection (→ Virtuoso later), so this extra is not pursued yet.
    "rdflib>=7.0",
    "pyoxigraph>=0.4",
]
visualization = [
    # Plotting / network visualization helpers. networkx itself is strict
    # (used by temporal/inference_engine) so it is NOT listed here to avoid
    # a duplicate constraint that could confuse pip resolvers.
    "matplotlib>=3.0",
    "plotly>=5.0",
]
sync = [
    # Backend-agnostic SQL bridge (s3dgraphy.sync) — bidirectional
    # ingestion + projection between a Graph and the host application's
    # SQL tables. SQLite works out of the box; add the [postgres] extra
    # for the PostgreSQL backend. Moved from pyArchInit in 1.6.0
    # (ExtendedMatrix/s3Dgraphy#10).
    "sqlalchemy>=2.0",
]
postgres = [
    # PostgreSQL backend driver. Combine with [sync] for the SQL bridge
    # (ExtendedMatrix/s3Dgraphy#9 + #10). Standalone, it also enables
    # the PG path of PyArchInitImporter when that lands.
    "psycopg2-binary>=2.9",
]
minio = [
    # MinIO / S3 object-storage backend for the Resource layer
    # (s3dgraphy.resources.minio_backend, R2). Without this extra, constructing
    # a client / ingesting raises MissingDependency (like rdflib for TTL);
    # resolve()/manifest work dep-free on an already-populated index.
    "minio>=7.0",
]
geo = [
    # Coordinate reprojection for api.reproject / api.georeference_scene (G1).
    # Excavation coordinates are normally PROJECTED (UTM, national grids) with
    # an EPSG code, and a map needs WGS84: that conversion needs PROJ.
    #
    # pyproj and not GDAL on purpose: the pyproj wheels BUNDLE PROJ, so this
    # extra installs with pip alone — no system binaries, no GDAL build. That
    # is exactly the fragile pipe this avoids. Without the extra, reprojection
    # raises MissingDependency (like rdflib for TTL) and every caller degrades:
    # the library imports, the graph loads, only the conversion is unavailable.
    "pyproj>=3.4",
]
pdf = [
    # Text extraction from PDF sources, for StratiMiner's Path A
    # (api.source_text). Without it a PDF is listed by name and its text is not
    # read — the honest degradation, not an error.
    #
    # pypdf and NOT PyMuPDF (E.D., 2026-08-03): PyMuPDF renders beautifully and
    # weighs 21 MB, all of which the FROZEN em-bridge sidecar would carry in order
    # to read some paragraphs. pypdf is ~350 KB, pure Python, no dependencies and
    # no compiled extension — so it also installs next to Blender's interpreter
    # without a build step. It reads the text LAYER; it does not do OCR, so a
    # scanned PDF reports "no text layer" instead of returning an empty string
    # that would read as an empty document.
    "pypdf>=4.0",
]
docx = [
    # .docx rendering of a baked narrative (BK1, api.export_narrative_docx).
    # DocX is the format for the reader who will never see the graph — LaTeX
    # serves the apparatus and Jupyter the analysis — so it is a first-class
    # output, but not every consumer publishes: a Blender addon and the GraphML
    # chain must not carry a Word writer.
    #
    # The PyPI package is `python-docx`; the import is `docx`. There is an
    # unrelated `docx` on PyPI, which is why the MissingDependency message names
    # both. Without the extra, api.bake_narrative still works — the bake is
    # independent of every renderer — and only export_narrative_docx raises.
    "python-docx>=1.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "build",
    "twine",
    "bump2version",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme",
    "myst-parser",
]
# Convenience aggregate — installs every runtime feature (RDF + viz)
# without the dev/docs tooling. The dev/docs/test stacks stay separate
# so CI-style installs don't pull editor/QA deps.
full = [
    "s3dgraphy[rdf-embedded,visualization,sync,minio,geo]",
]
all = [
    "s3dgraphy[full,dev,docs,postgres]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s3dgraphy = [
    "*.json",
    "*.yaml",
    "data/*",
    "data/*.md",
    "templates/*",
    "templates/*.graphml",
    "templates/*.xlsx",
    "JSON_config/*",
    "JSON_config/*.json",
    "mappings/*",
    "mappings/*.json",
]
# authorities snapshots (P1-D) are DATA files in a subpackage — ship them in the
# wheel so the offline resolver works when installed (e.g. bundled into Blender).
"s3dgraphy.authorities" = [
    "snapshots/*",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: reads real data when it is on this machine (skipped otherwise)",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
